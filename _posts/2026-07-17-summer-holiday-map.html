<p>The final summer holiday railway route map.</p>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
         
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
         
    <style>
        #map { 
            height: 100vh; 
            width: 100%; 
        }
        body {
            padding: 0;
            margin: 0;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        //Initialize the map (centered on Europe)
        var map = L.map('map').setView([55, 15], 4);

        // Add a tile layer (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        const locations = [
            { name: "Day 0: Edinburgh", lat: 55.9533, lon: -3.1883 },
            { name: "Day 1: London", lat: 51.53152995517071, lon: -0.12387675257499983 },
            { name: "Day 1: Bruxelles", lat: 50.836, lon: 4.335 },
            { name: "Day 1: Koln", lat: 50.9375, lon: 6.9603 },
            { name: "Day 1: Essen", lat: 51.45157, lon: 7.01515 },
            { name: "Day 2: Hamburg", lat: 53.5511, lon: 9.9937 },
            { name: "Day 3: Copenhagen", lat: 55.6726620604375, lon: 12.565327657343909 },
            { name: "Day 3: Lund", lat: 55.7047, lon: 13.1910 },
            { name: "Day 4: Almhult", lat: 56.55229183809641, lon: 14.13435953988308 },
            { name: "Day 4: Lund", lat: 55.7047, lon: 13.1910 },
            { name: "Day 5: Gothenburg", lat: 57.7089, lon: 11.9746 },
            { name: "Day 6: Stockholm (Board Ferry)", lat: 59.3293, lon: 18.0686 },
            { name: "Day 7-10: Helsinki", lat: 60.1699, lon: 24.9384 },
            { name: "Day 10-12: Kolari", lat: 67.3305, lon: 23.7799 },
            { name: "Day 12-13: Tampare", lat: 61.4961, lon: 23.7789 },
            { name: "Day 14: Helsinki", lat: 60.1699, lon: 24.9384 },
            { name: "Day 15: Turu", lat: 60.453080062016575, lon: 22.253051828402295 },
            { name: "Day 15: Naantali", lat: 60.46332005128995, lon: 22.03266207923292 },
            { name: "Day 16: Kapellskar", lat: 59.72308190627703, lon: 19.066296340437088 },
            { name: "Day 16: Stockholm", lat: 59.3293, lon: 18.0686 },
            { name: "Day 16: Karlstad", lat: 59.3836530544992, lon: 13.506907104846283 },
            { name: "Day 17: Kongsvinger", lat: 60.19475901050352, lon: 12.006105351441041 },
            { name: "Day 18-21: Oslo", lat: 51.53152995517071, lon: -0.12387675257499983 },
            { name: "Day 21: Edinburgh (Return)", lat: 55.9533, lon: -3.1883 }
        ];

        var latLngs = [];

        // Loop through locations to create markers and polyline path
        locations.forEach(function(location, index) {
            var latLng = [location.lat, location.lon];
            latLngs.push(latLng);

            // Add a marker with a popup
            L.marker(latLng)
                .addTo(map)
                .bindPopup("<b>" + location.name + "</b>");
        });

        // Draw the polyline for the route
        var polyline = L.polyline(latLngs, {
            color: 'blue',
            weight: 3,
            opacity: 0.7
        }).addTo(map);

        // Zoom the map to fit the entire route
        map.fitBounds(polyline.getBounds());

    </script>
